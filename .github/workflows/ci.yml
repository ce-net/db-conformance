# Manual only (Leif 2026-10-14 00:12 CEST: "We have used 90% of our actions on GitHub"): run it with
# `gh workflow run test -R Leif-Rydenfalk/db-conformance`. Private git deps (ce-db-rs, ce-db-ts, rust-stack,
# state-store-cell) are read with the deploy keys in secret CE_DEPLOY_KEYS, one per private dep repo.
name: test
on:
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: private git deps (read-only deploy keys)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CE_DEPLOY_KEYS }}
      - run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
      - run: npm ci && npm run build
      - run: cargo build
      - name: D1..D13, D8 both ways (dev stores; D11 kills and restarts one)
        run: target/debug/db-conformance
      - name: the generated files are current
        run: |
          cargo install --git https://github.com/Leif-Rydenfalk/rust-stack --rev 2d463628f491170b18f249bec13d014faf2317c7 ce-wire-gen --locked
          ce-wire-gen --records schema/src/lib.rs --lang ts -o sdk/ts
          ce-wire-gen --records schema/src/lib.rs --lang json -o schemas
          git diff --exit-code sdk/ schemas/ || (echo 'sdk/ or schemas/ is stale: run ce-wire-gen --records and commit' && exit 1)
